area: SE
period:                       # ISO years (weeks run Monday-Monday in UTC)
  first_iso_year: 2015
  last_iso_year: 2025

reservoir:
  capacity_gwh: null          # null -> use the maximum observed historical storage
  hydro_capacity_mw: 16300    # to be checked against an official source
  availability: 0.85
  # Minimum release R_min_t: this percentile, over the years, of each ISO week's
  #   production     - hydro production (the guide's definition), or
  #   inflow_capped  - min(production, inflow): forced production (run-of-river, minimum flows,
  #                    the flood) cannot exceed what flows in during the week.
  # Production-based R_min treats winter output, which follows demand, as a physical minimum:
  # it forces water out at low storage and makes winter water values rise with storage
  # (notebook 04 compares both).
  rmin_percentile: 5
  rmin_basis: inflow_capped

price_model:                  # p = alpha + season + gamma p_DE + slope N, N per 168-h stage (guide 5.2)
  # Base model, chosen in notebook 03 by the selection rule below (`watervalues price` reports
  # whether this choice agrees with the rule; it never changes it):
  slope_form: proportional    # constant: slope = beta (guide) | proportional: slope = kappa p_DE
  seasonal_dummies: true
  exclude_years: []           # [] (all years) or exactly crisis_years
  # Variants compared with the base: both slope forms, with and without seasonal dummies, with
  # and without these years (energy crisis, SE1/SE2 decoupled from SE3/SE4).
  crisis_years: [2021, 2022, 2023]
  seasons: {Q1: 1, Q2: 14, Q3: 27, Q4: 40}   # first ISO week: calendar quarters; Q1 is the reference
  # Newey-West (Bartlett) standard errors: the residual autocorrelation lasts about a quarter.
  hac_maxlags: 13             # [weeks]
  hac_lag_sensitivity: [4, 13, 26, 52]   # [weeks] slope t-value reported at each
  residual_acf_lags: [1, 4, 13, 26]      # [weeks]
  # Selection rule: lowest pooled leave-one-year-out RMSE of the weekly price; variants within
  # this tolerance tie and the smallest out-of-sample seasonal bias wins, then fewer parameters.
  selection_tolerance_eur_mwh: 0.5
  weekly_csv: outputs/price_weekly.csv       # regression table, fitted and LOYO prices per week
  variants_csv: outputs/price_variants.csv   # the variant comparison
  curve_json: outputs/price_curve.json       # the base curve (the SDP refits the same one)
  report: outputs/price_report.txt

sdp:                          # weekly SDP over the 52 stages of a periodic year (guide 5.3-5.4)
  n_storage_points: 201
  discount_rate_annual: 0.05
  spill_penalty_eur_mwh: 0.01 # only breaks ties between spilling and releasing
  tol_eur_mwh: 0.05           # stop when no water value moves more than this between cycles
  max_cycles: 50
  # Base-case German price per ISO week: the mean seasonal shape of the years outside
  # price_model.crisis_years (without_crisis) or of all years (all_years), scaled to the mean of
  # all years (level null) or to this annual mean [EUR/MWh] (the continental price scenarios).
  # With all years the 2022 gas-price spikes make the summer the dearest quarter.
  de_price_shape: without_crisis
  de_price_level_eur_mwh: null
  grid_sensitivity_points: [101, 201, 401]
  curve_weeks: [2, 16, 30, 44]               # ISO weeks shown as water value curves
  report_fillings_pct: [10, 25, 50, 75, 90]  # storage levels tabulated in the report [%]
  values_npz: outputs/water_values.npz       # V, w and the policy, with the problem inputs
  water_values_csv: outputs/water_values.csv # w per ISO week and storage level
  report: outputs/sdp_report.txt

simulation:                   # forward simulation, backtest and scenarios (guide 5.5-5.6)
  decision_step_gwh: 10       # release grid of the weekly decision [GWh]
  backtest_csv: outputs/backtest_weekly.csv   # simulated and observed, every week and year
  metrics_csv: outputs/backtest_metrics.csv   # accuracy per year and over all years
  de_price_csv: outputs/scenario_de_price.csv # water values per German price level
  dry_wet_csv: outputs/scenario_dry_wet.csv   # the driest and wettest year from one start
  checks_csv: outputs/simulate_checks.csv     # convergence and checks of every SDP solved
  report: outputs/simulate_report.txt

scenarios:
  de_price_levels_eur_mwh: [50, 80, 120]

figures:
  dir: reports/figures         # PNGs for the README, written by `watervalues figures`

findings:                     # the README's key numbers, written by `watervalues findings`
  numbers_json: reports/key_numbers.json
  readme: README.md
  scarce_point: [44, 10]      # ISO week and storage [%] quoted for scarce water
  full_point: [16, 90]        # and for a full reservoir before the spring flood

inflow:                       # I = storage_end - storage + hydro (spill not observed: assumed 0)
  # Negative weekly inflow down to -negative_noise_gwh is storage-reporting noise: it is clipped
  # to 0 and listed. About twice the 76 GWh/week winter RMSE of the implied inflow against
  # Energiföretagen's published inflow (data/processed/validation_energiforetagen.txt).
  # A larger negative stops `watervalues inflow`.
  negative_noise_gwh: 150
  weekly_csv: outputs/inflow_weekly.csv       # balance, stage inflow and status of every week
  scenarios_csv: outputs/inflow_scenarios.csv # ISO years x 52 stages [GWh per 168-h stage]
  report: outputs/inflow_report.txt

data:
  source: entsoe_api          # entsoe_api (REST API token) | filelib (website login)
  raw_dir: data/raw
  weekly_csv: data/processed/weekly_se.csv
  build_report: data/processed/build_report.txt   # sanity report of the last build
  known_gaps_file: data/known_gaps.yaml
  min_coverage: 0.95          # share of a week's hours with data; below it the week is NaN
  csv_float_format: "%.3f"
  country: SE
  price_zones: [SE1, SE2, SE3, SE4]
  areas:                      # EIC code and AreaTypeCode as found in the exports (null: any)
    SE: {eic: "10YSE-1--------K", area_type: CTA/CTY}
    SE1: {eic: "10Y1001A1001A44P", area_type: BZN}
    SE2: {eic: "10Y1001A1001A45N", area_type: BZN}
    SE3: {eic: "10Y1001A1001A46L", area_type: BZN}
    SE4: {eic: "10Y1001A1001A47J", area_type: BZN}
    DE_LU: {eic: "10Y1001A1001A82H", area_type: BZN}
    DE_AT_LU: {eic: "10Y1001A1001A63L", area_type: null}
  de_price:                   # German day-ahead price: bidding-zone split on 2018-10-01
    before: DE_AT_LU
    after: DE_LU
    switch_utc: "2018-09-30T22:00:00Z"
  prices:                     # day-ahead auction rows to keep from the price exports
    contract_type: Day-ahead
    currency: EUR
    sequences: ["", "1"]      # no sequence, or sequence 1 (SDAC) where several auctions exist
  generation_categories:      # ENTSO-E production types (PSR codes); the rest is "other"
    hydro: [B10, B11, B12]
    nuclear: [B14]
    wind: [B18, B19]
    solar: [B16]
  # Types that ENTSO-E reports for Sweden only during part of the period (the build report lists
  # each type's first and last interval): outside that span they count as zero. Any other type
  # that is absent for a week makes its category missing, e.g. nuclear absent at the cache end.
  partial_period_types: [B04, B13, B16]
  reservoir:
    area: SE
    # Value published for ISO week w = storage at the END of week w. Verified: ENTSO-E 2026-W43
    # equals Energiföretagen "Kraftläget i Sverige" week 43/2026 ("vid veckans slut") in all areas,
    # and `watervalues validate` compares 2019-2025 with Energiföretagen's weekly statistics.
    label_semantics: end_of_week
    max_interp_weeks: 1       # a single missing weekly value is interpolated (and reported)
    winter_weeks: [2, 14]     # ISO weeks used by the physics check of the convention
    # Winter-inflow roughness of the configured convention / the labels shifted by one week.
    # Roughness cannot rule out a weekly mean (see watervalues.data.reservoir): references do.
    max_shift_roughness_ratio: 0.7
    reference_tolerance_gwh: 1
    references:               # Energiföretagen, Kraftläget i Sverige, vecka 43 2026, page 1
      - {area: SE, iso_year: 2026, iso_week: 43, stored_gwh: 25339}
      - {area: SE1, iso_year: 2026, iso_week: 43, stored_gwh: 10447}
      - {area: SE2, iso_year: 2026, iso_week: 43, stored_gwh: 12976}
      - {area: SE3, iso_year: 2026, iso_week: 43, stored_gwh: 1872}
      - {area: SE4, iso_year: 2026, iso_week: 43, stored_gwh: 44}
  sanity:                     # guide section 4 orders of magnitude, widened; warnings only
    load_twh_per_year: [120, 150]
    hydro_twh_per_year: [55, 80]
    storage_capacity_ref_gwh: 33700   # Energiföretagen: 100 % = 33.7 TWh
    zone_load_rel_tol: 0.02           # |sum of SE1-SE4 load / SE load - 1|
    max_pumping_share: 0.01           # pumping consumption / hydro production
  api:                        # ENTSO-E REST API through entsoe-py
    env_file: .env            # holds ENTSOE_API_KEY (never committed)
    retry_count: 3            # entsoe-py's own attempts on connection errors
    retry_delay_s: 10
    timeout_s: 120
    max_retries: 4            # our retries on timeouts and server errors (exponential backoff)
    backoff_s: 15
  filelib:
    keyring_service: nordic-hydro-watervalues/entsoe-tp
    token_url: https://keycloak.tp.entsoe.eu/realms/tp/protocol/openid-connect/token
    client_id: tp-fms-public
    timeout_s: 300
    max_requests_per_minute: 30   # the File Library allows 100; HTTP 429 bans for 10 minutes
    max_retries: 4
    backoff_s: 5
    read_chunk_rows: 200000       # exports are read in chunks to keep memory bounded
    folders:
      generation: AggregatedGenerationPerType_16.1.B_C_r3
      load: ActualTotalLoad_6.1.A_r3
      price: EnergyPrices_12.1.D_r3.1
      reservoir: AggregatedFillingRateOfWaterReservoirsAndHydroStoragePlants_16.1.D_r3
  energiforetagen:            # independent check of the reservoir data (`watervalues validate`)
    dir: data/external/energiforetagen   # downloaded workbooks, never committed
    report: data/processed/validation_energiforetagen.txt
    max_storage_gwh: 33748    # "(max mag 33 748 GWh)", printed under the filling row
    timeout_s: 60
    workbooks:                # "Veckostatistik": energiforetagen.se/statistik/elstatistik/arkiv-aldre-statistik/
      2019: https://www.energiforetagen.se/4a4a79/globalassets/energiforetagen/statistik/el/vecko--och-manadsstatistik/vecka_01-52_2019.xlsx
      2020: https://www.energiforetagen.se/4ab721/globalassets/energiforetagen/statistik/el/vecko--och-manadsstatistik/vecka_01-53_2020_v2.xlsx
      2021: https://www.energiforetagen.se/4ab73f/globalassets/energiforetagen/statistik/el/vecko--och-manadsstatistik/vecka_01-52_2021_v2.xlsx
      2022: https://www.energiforetagen.se/4ab735/globalassets/energiforetagen/statistik/el/vecko--och-manadsstatistik/vecka_01-52_2022_v2.xlsx
      2023: https://www.energiforetagen.se/49812f/globalassets/energiforetagen/statistik/el/vecko--och-manadsstatistik/vecka_01-52_2023_ver_d.xlsx
      2024: https://www.energiforetagen.se/496e9b/globalassets/energiforetagen/statistik/el/vecko--och-manadsstatistik/vecka_01-52_2024_ver_v.xlsx
      2025: https://www.energiforetagen.se/499f8e/globalassets/energiforetagen/statistik/el/vecko--och-manadsstatistik/vecka_01-52_2025_ver_a.xlsx
