area: SE
period:                       # ISO years (weeks run Monday-Monday in UTC)
  first_iso_year: 2015
  last_iso_year: 2025

reservoir:
  capacity_gwh: null          # null -> use the maximum observed historical storage
  hydro_capacity_mw: 16300    # to be checked against an official source
  availability: 0.85
  rmin_percentile: 5

price_model:
  seasonal_dummies: true
  exclude_years: []           # e.g. [2022] for the variant without the energy crisis

sdp:
  n_storage_points: 201
  discount_rate_annual: 0.05
  spill_penalty_eur_mwh: 0.01
  tol_eur_mwh: 0.05
  max_cycles: 50

simulation:
  decision_step_gwh: 10

scenarios:
  de_price_levels_eur_mwh: [50, 80, 120]

data:
  source: entsoe_api          # entsoe_api (REST API token) | filelib (website login)
  raw_dir: data/raw
  weekly_csv: data/processed/weekly_se.csv
  build_report: data/processed/build_report.txt   # sanity report of the last build
  known_gaps_file: data/known_gaps.yaml
  min_coverage: 0.95          # share of a week's hours with data; below it the week is NaN
  csv_float_format: "%.3f"
  country: SE
  price_zones: [SE1, SE2, SE3, SE4]
  areas:                      # EIC code and AreaTypeCode as found in the exports (null: any)
    SE: {eic: "10YSE-1--------K", area_type: CTA/CTY}
    SE1: {eic: "10Y1001A1001A44P", area_type: BZN}
    SE2: {eic: "10Y1001A1001A45N", area_type: BZN}
    SE3: {eic: "10Y1001A1001A46L", area_type: BZN}
    SE4: {eic: "10Y1001A1001A47J", area_type: BZN}
    DE_LU: {eic: "10Y1001A1001A82H", area_type: BZN}
    DE_AT_LU: {eic: "10Y1001A1001A63L", area_type: null}
  de_price:                   # German day-ahead price: bidding-zone split on 2018-10-01
    before: DE_AT_LU
    after: DE_LU
    switch_utc: "2018-09-30T22:00:00Z"
  prices:                     # day-ahead auction rows to keep from the price exports
    contract_type: Day-ahead
    currency: EUR
    sequences: ["", "1"]      # no sequence, or sequence 1 (SDAC) where several auctions exist
  generation_categories:      # ENTSO-E production types (PSR codes); the rest is "other"
    hydro: [B10, B11, B12]
    nuclear: [B14]
    wind: [B18, B19]
    solar: [B16]
  reservoir:
    area: SE
    # Value published for ISO week w = storage at the END of week w. Verified: ENTSO-E 2026-W43
    # equals Energiföretagen "Kraftläget i Sverige" week 43/2026 ("vid veckans slut") in all areas.
    label_semantics: end_of_week
    max_interp_weeks: 1       # a single missing weekly value is interpolated (and reported)
    winter_weeks: [2, 14]     # ISO weeks used by the physics check of the convention
    max_roughness_ratio: 0.7
    reference_tolerance_gwh: 1
    references:               # Energiföretagen, Kraftläget i Sverige, vecka 43 2026, page 1
      - {area: SE, iso_year: 2026, iso_week: 43, stored_gwh: 25339}
      - {area: SE1, iso_year: 2026, iso_week: 43, stored_gwh: 10447}
      - {area: SE2, iso_year: 2026, iso_week: 43, stored_gwh: 12976}
      - {area: SE3, iso_year: 2026, iso_week: 43, stored_gwh: 1872}
      - {area: SE4, iso_year: 2026, iso_week: 43, stored_gwh: 44}
  sanity:                     # guide section 4 orders of magnitude, widened; warnings only
    load_twh_per_year: [120, 150]
    hydro_twh_per_year: [55, 80]
    storage_capacity_ref_gwh: 33700   # Energiföretagen: 100 % = 33.7 TWh
    zone_load_rel_tol: 0.02           # |sum of SE1-SE4 load / SE load - 1|
    max_pumping_share: 0.01           # pumping consumption / hydro production
  api:                        # ENTSO-E REST API through entsoe-py
    env_file: .env            # holds ENTSOE_API_KEY (never committed)
    retry_count: 3
    retry_delay_s: 10
    timeout_s: 120
    reservoir_overlap_days: 21    # overlapping windows: entsoe-py 0.8.1 drops year-boundary weeks
  filelib:
    keyring_service: nordic-hydro-watervalues/entsoe-tp
    token_url: https://keycloak.tp.entsoe.eu/realms/tp/protocol/openid-connect/token
    client_id: tp-fms-public
    timeout_s: 300
    max_requests_per_minute: 30   # the File Library allows 100; HTTP 429 bans for 10 minutes
    max_retries: 4
    backoff_s: 5
    read_chunk_rows: 200000       # exports are read in chunks to keep memory bounded
    folders:
      generation: AggregatedGenerationPerType_16.1.B_C_r3
      load: ActualTotalLoad_6.1.A_r3
      price: EnergyPrices_12.1.D_r3.1
      reservoir: AggregatedFillingRateOfWaterReservoirsAndHydroStoragePlants_16.1.D_r3
